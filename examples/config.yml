# Neural Shell (nlsh) — configuration reference
#
# Copy this file to ~/.nlsh/config.yml (or ~/.config/nlsh/config.yml) and edit
# it. Every supported key is documented below with its purpose, default and
# allowed values. Keys shown commented out are optional and fall back to the
# documented default.
#
# Lookup order for the config file:
#   1. the path passed to --config
#   2. ~/.nlsh/config.yml
#   3. ~/.config/nlsh/config.yml

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------

# Shell used for generated commands.
# Default: bash. Allowed: bash, zsh, fish.
# Override with environment variable: NLSH_SHELL
shell: "bash"

# ---------------------------------------------------------------------------
# LLM backends
#
# Any OpenAI-compatible endpoint works. The list order defines the CLI flags:
# the first entry is `nlsh -0`, the second `nlsh -1`, and so on (up to -9).
#
# Required per backend: name, url, model.
# Everything else is optional and defaults as documented.
# ---------------------------------------------------------------------------
backends:
  # Backend 0 — full-featured entry showing every supported key.
  - name: "openai"
    # Required. Used in error messages and enables the <NAME>_API_KEY env var
    # (here: OPENAI_API_KEY) as an override for this backend's api_key.
    url: "https://api.openai.com/v1"
    # Required. Base URL of the OpenAI-compatible API.
    model: "gpt-4o-mini"
    # Required. Model name as the endpoint expects it.
    api_key: $OPENAI_API_KEY
    # Literal key, or "$VAR" to read it from that environment variable.
    # Default: "" (empty). Non-local endpoints require a key of 8+ characters.
    timeout: 120.0
    # Request timeout in seconds. Must be positive.
    # Default: 120.0, or 300.0 when url points at localhost/127.0.0.1/::1/unix://.
    is_reasoning_model: false
    # Set true for reasoning models so `-v` streams their reasoning tokens.
    # Default: false (auto-enabled when the backend name contains "reason").
    supports_vision: false
    # Set true for vision-capable models; required to process image STDIN input.
    # Default: false.
    max_image_size_mb: 20.0
    # Maximum accepted image size in MB (only relevant with supports_vision).
    # Must be positive. Default: 20.0.
    structured_output: auto
    # Ask the model for JSON {command, danger_level} instead of a bare command,
    # which enables the "potentially destructive" warning before execution.
    # Applies to command generation/regeneration/fixing only — never to
    # explanations, STDIN processing or nlgc.
    #   auto (default): try json_schema, then json_object, then fall back to
    #                   plain text if the backend supports neither.
    #   json_schema:    always request strict, schema-validated JSON.
    #   json_object:    always request a plain JSON object (schema described in
    #                   the prompt instead of enforced by the API).
    #   off:            never request structured output (plain-text behavior).
    # Default: auto. Allowed: auto, json_schema, json_object, off.
    tool_calling: auto
    # Let the model call local read-only tools (list_directory, read_env_var,
    # which, help_snippet, man_summary) to fetch context on demand instead of
    # receiving all of it up front. Same scope as structured_output above.
    #   auto (default): offer tools; silently fall back if the backend rejects
    #                   the `tools` parameter.
    #   on:             always offer tools; error out if rejected (the error
    #                   suggests setting this to off).
    #   off:            never offer tools; always send the full up-front context.
    # Default: auto. Allowed: auto, on, off.

  # Backend 1 — vision-capable, referenced by stdin.default_backend_vision below.
  - name: "openai-gpt4-vision"
    url: "https://api.openai.com/v1"
    model: "gpt-4o"
    api_key: $OPENAI_API_KEY
    supports_vision: true      # Required to accept images from STDIN
    max_image_size_mb: 20.0

  # Backend 2 — minimal local Ollama entry (no real API key required).
  - name: "local-ollama"
    url: "http://localhost:11434/v1"
    model: "llama3"
    api_key: "ollama"          # Placeholder; local endpoints send no auth header

  # Backend 3 — reasoning model.
  - name: "deepseek-reasoner"
    url: "https://api.deepseek.com/v1"
    model: "deepseek-reasoner"
    api_key: $DEEPSEEK_API_KEY
    is_reasoning_model: true   # Enables reasoning-token output in verbose mode

  # Backend 4 (example) — local vision model. Uncomment to enable.
  # - name: "local-llava"
  #   url: "http://localhost:11434/v1"
  #   model: "llava"
  #   api_key: "ollama"
  #   supports_vision: true
  #   max_image_size_mb: 10.0   # Smaller limit for local models

  # Backend 5 (example) — endpoint behind a proxy that mangles response_format
  # and does not implement function calling. Uncomment to enable.
  # - name: "picky-proxy"
  #   url: "https://proxy.example.com/v1"
  #   model: "some-model"
  #   api_key: $PROXY_API_KEY
  #   structured_output: off
  #   tool_calling: off

# Backend used when no -0..-9 flag is given (index into the list above).
# Default: 0.
# Override with environment variable: NLSH_DEFAULT_BACKEND
default_backend: 0

# ---------------------------------------------------------------------------
# STDIN processing (`cat file | nlsh <instruction>`)
#
# Optional section. Override with environment variables:
#   NLSH_STDIN_DEFAULT_BACKEND, NLSH_STDIN_DEFAULT_BACKEND_VISION,
#   NLSH_STDIN_MAX_TOKENS
# ---------------------------------------------------------------------------
stdin:
  # Backend for text STDIN processing.
  # Default: null (falls back to the global default_backend).
  default_backend: 0

  # Backend for image STDIN processing. Should point at a backend with
  # supports_vision: true.
  # Default: null (falls back to stdin.default_backend, then default_backend).
  default_backend_vision: 1

  # Maximum output tokens in STDIN mode. Must be a positive integer.
  # Default: 2000. Overridden by the --max-tokens flag.
  max_tokens: 2000

# ---------------------------------------------------------------------------
# nlgc (Neural Git Commit)
#
# Optional section. Override with environment variables:
#   NLSH_NLGC_INCLUDE_FULL_FILES (true/false), NLSH_NLGC_LANGUAGE,
#   NLSH_NLGC_DEFAULT_BACKEND
# ---------------------------------------------------------------------------
nlgc:
  # Include the full content of changed files in the prompt, not just the diff.
  # More context, significantly more tokens. Must be a boolean.
  # Default: true. Overridden by --full-files / --no-full-files.
  include_full_files: true

  # Language for generated commit messages, e.g. "Spanish", "French", "German".
  # Must be null or a non-empty string.
  # Default: null (English). Overridden by --language/-l.
  language: null

  # Backend used by nlgc. Must be a non-negative integer or null.
  # Default: null (falls back to the global default_backend).
  default_backend: null
