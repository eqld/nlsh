[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-shell"
description = "Neural Shell (nlsh) - AI-driven command-line assistant"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "eqld", email = "44535024+eqld@users.noreply.github.com" },
]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "openai>=1.40.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/eqld/nlsh"
Repository = "https://github.com/eqld/nlsh"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
nlsh = "nlsh.cli:main"
nlgc = "nlsh.git_commit:main"
nlt = "nlsh.token_count:main"

[tool.setuptools]
packages = ["nlsh", "nlsh.tools"]

[tool.setuptools.dynamic]
version = { attr = "nlsh.__version__" }

[tool.black]
line-length = 100
target-version = ["py39"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length handled loosely; long strings/prompts exist
    "SIM105", # contextlib.suppress not required
]

[tool.ruff.lint.isort]
known-first-party = ["nlsh"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false